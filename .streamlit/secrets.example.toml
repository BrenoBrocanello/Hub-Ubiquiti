# Copie estes campos para os Secrets do Streamlit Cloud ou para .streamlit/secrets.toml local.
# Nunca commite .streamlit/secrets.toml com chaves reais.

# URL publica do app. Se ficar vazio, o app tenta detectar automaticamente pela URL atual.
hub_public_url = "https://seu-app.streamlit.app"

# Gmail exige "senha de app", nao a senha normal da conta.
# Crie no Google Account > Security > 2-Step Verification > App passwords.
gmail_app_password = "cole_a_senha_de_app_do_gmail_aqui"

# Opcional: use se o remetente for outro e-mail.
# gmail_user = "breno.brocanello@gmail.com"

[supabase]
url = "https://xxxxx.supabase.co"
secret_key = "sb_secret_xxxxx"

